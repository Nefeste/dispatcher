# Звонит сам больной (docs/08-game-design.md, §3). Кто вызвал — поле карточки вызова 112 (pp1931); что говорят
# первым — памятка mos-103. Доли — оценка, их подбирает «виртуальный диспетчер».
name: сам
self: true
at: [home, street]
weight: 30
relations:
  - { caller: сам, as: m, patient: { m: сам, f: сама }, picture: { m: man, f: daughter } }
# не отвечает, путается, судороги, речь нарушена — сам не позвонит
cannot: [sign.gcs_low, sym.confusion, sign.postictal, sym.seizure, sym.speech_trouble, sym.strange_behavior]
unsure: ["Не знаю, не замечал{|а}", "Не могу сказать"]
# повторный звонок — бригады всё нет
again: ["Это опять я. Хуже мне, когда приедут?"]
# звонят снова после отказа в выезде, когда повод был (срез, С3; docs/08-game-design.md, §7)
refused: ["Я уже звонил{^|а}, вы не приехали. Мне хуже, приезжайте"]
nothing: ["Да больше ничего, всё сказал{|а}"]
estimate: true
sources: ["pp1931", "mos-103"]
review: draft
