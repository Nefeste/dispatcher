# Город прототипа (docs/04-data-model.md, «Город»; ADR 0004): улицы — OpenStreetMap, подстанции и больницы —
# вымышленные, их имена не совпадают с настоящими учреждениями района (паспорт карты, institutionsInArea).
# `at` — единицы карты (0,5 м от северо-западного угла, x — на восток, y — на юг); сборка привязывает точку к
# ближайшему узлу дорог и проверяет, что от каждой подстанции доезжают до каждой больницы и обратно.
map: nn-center
bases:
  - { id: base.north, name: "Подстанция «Север»", at: [3200, 6200] }
  - { id: base.south, name: "Подстанция «Юг»", at: [8600, 12600] }
hospitals:
  - { id: hosp.61, name: "Городская больница № 61", at: [9600, 14400], profiles: [stroke, cardio, general] }
  - { id: hosp.62, name: "Больница скорой помощи № 62", at: [2600, 9200], profiles: [trauma, general] }
  - { id: hosp.63, name: "Городская больница № 63", at: [6200, 16000], profiles: [general] }
