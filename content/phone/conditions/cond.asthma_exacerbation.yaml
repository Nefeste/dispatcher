# Смерть до приезда бригады (срез, С3) — только при тяжёлом обострении: острая дыхательная недостаточность «может
# представлять непосредственную угрозу для жизни больного» (cr-359, 1.5). Минуты опоздания и шанс — оценка.
fatal: { late: 20, chance: 40, when: { severity: [severe] }, source: "cr-359, 1.5" }
# Бригада на месте просит реанимационную (срез, С4) — тяжёлое обострение с сатурацией ниже 93 %: «около 5 % всех
# пациентов с обострением БА требуют проведения интубации трахеи и искусственной вентиляции легких» (cr-359, 1.3).
# Прочтение — как у ОКС: интубация и ИВЛ — «специальные методы» (388н, прил. 2, п. 17), бригада анестезиологии-
# реанимации (п. 9). В генераторе «Анамнеза» тяжёлых с сатурацией ниже 93 % — около 5 % обострений.
resus: { when: { severity: [severe], spo2_below93: [yes] }, source: "cr-359, 1.3" }
estimate: true
sources: ["388n, п. 13 «а»", "388n, п. 11 «б»", "916n, п. 9", "cr-359, разд. 6", "cr-359, 1.5", "cr-359, 1.3", "388n, прил. 2, пп. 9, 17"]
notes: "Тяжёлое обострение — экстренная форма (п. 11 «б»), лёгкое — неотложная. По телефону тяжесть видна по одышке (`sym.dyspnea`): она делает форму экстренной. Больница — пульмонология, терапия или реанимация (916n, п. 9): общий профиль."
