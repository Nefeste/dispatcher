# Болезнь по телефону (docs/04-data-model.md, §1): своё у «Диспетчера» к записи «Анамнеза» с тем же идентификатором.
# Форма, профиль больницы и окно — из источников (docs/09-content.md, «Медицина состояний»); доли, минуты на месте и до
# звонка — оценка (estimate), их подбирает «виртуальный диспетчер». Проценты — целые.
weight: 8
form: emergency
hospital: stroke
transport: 100
scene: [15, 25]
street: 15
onset: [[30, 30], [90, 30], [240, 25], [720, 15]]
window: { minutes: 270, from: onset, source: "cr-814, 3.1.2.1.1" }
estimate: true
sources: ["388n, п. 11, вводная часть", "928n, пп. 17–18", "cr-814, разд. 6", "cr-814, 3.1.2.1.1"]
notes: "Окно — тромболизис в первые 4,5 часа от начала; в игре — до прибытия в сосудистый центр (прочтение: время от двери до иглы не считается). Тромбэктомия — до 6 и 16 часов — в прототипе не считается."
