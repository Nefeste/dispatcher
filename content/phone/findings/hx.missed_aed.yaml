# Признак «по телефону» (срез, С5б; решение владельца #38, вариант 3): что о нём скажет звонящий. Доли `tell` — оценка.
tell: { self: never, relative: sometimes, neighbour: rarely, bystander: never }
says:
  present:
    self: []
    other: ["Таблетки от эпилепсии бросил{|а} пить", "Лекарства от приступов не принимал{|а}, забывал{|а}", "Противосудорожные пропускал{|а}"]
estimate: true
sources: ["anamnez"]
notes: "Пропуск противоэпилептических препаратов — частая причина статуса у больных эпилепсией (запись «Анамнеза»). Только класс препаратов, без названий и доз."
review: draft
