# Признак «по телефону» (срез, С5б; решение владельца #38, вариант 3): что о нём скажет звонящий. Доли `tell` — оценка.
tell: { self: always, relative: usually, neighbour: often, bystander: sometimes }
says:
  present:
    self: ["Вдруг стало нечем дышать", "Резко задохнул{ся|ась}, ни с того ни с сего", "Дышать вдруг не могу, только что всё было нормально"]
    other: ["Вдруг стало нечем дышать, резко", "Задыхается, началось внезапно", "Только что нормально было — и вдруг дышать не может"]
threat: "388n, п. 11 «б»"
estimate: true
sources: ["anamnez", "388n, п. 11 «б»"]
notes: "Одышка, начавшаяся за секунды или минуты (запись «Анамнеза», PIOPED II) — нарушение дыхания, п. 11 «б»."
review: draft
