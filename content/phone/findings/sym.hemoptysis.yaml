# Признак «по телефону» (срез, С5б; решение владельца #38, вариант 3): что о нём скажет звонящий. Доли `tell` — оценка.
tell: { self: always, relative: often, neighbour: sometimes, bystander: sometimes }
says:
  present:
    self: ["Кашляю с кровью", "С кашлем кровь", "Откашливаю кровь"]
    other: ["Кашляет с кровью", "С кашлем кровь идёт", "Кровь при кашле"]
estimate: true
sources: ["anamnez"]
notes: "Кровохарканье — у 5 % при ТЭЛА (запись «Анамнеза», PIOPED II). Признаком угрозы не отмечено: объём по телефону не оценить."
review: draft
