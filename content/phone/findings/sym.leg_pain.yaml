# Признак «по телефону» (срез, С5б; решение владельца #38, вариант 3): что о нём скажет звонящий. Доли `tell` — оценка.
tell: { self: always, relative: often, neighbour: rarely, bystander: never }
says:
  present:
    self: ["Нога болит, в икре", "Икра болит, тянет", "Болит голень, давно уже"]
    other: ["Говорит, нога болит", "Жалуется на икру", "Нога у {него|неё} болит, в икре"]
estimate: true
sources: ["anamnez"]
notes: "Боль в ноге — при тромбозе глубоких вен (запись «Анамнеза»: ТЭЛА)."
review: draft
