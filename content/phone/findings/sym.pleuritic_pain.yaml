# Признак «по телефону» (срез, С5б; решение владельца #38, вариант 3): что о нём скажет звонящий. Доли `tell` — оценка.
tell: { self: always, relative: often, neighbour: rarely, bystander: never }
says:
  present:
    self: ["Больно вдохнуть, колет в груди", "В боку колет, когда дышу", "Глубоко вдохнуть не могу — колет"]
    other: ["Говорит, больно вдохнуть", "Колет в груди при вдохе", "Жалуется, что на вдохе колет"]
estimate: true
sources: ["anamnez"]
notes: "Боль при дыхании — раздражение плевры (запись «Анамнеза», ESC 2019, 4.1). Сама по себе угрозу жизни не означает: форму решает одышка."
review: draft
