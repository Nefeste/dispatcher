# Признак «по телефону» (срез, С5б; решение владельца #38, вариант 3): что о нём скажет звонящий. Доли `tell` — оценка.
tell: { self: often, relative: usually, neighbour: often, bystander: usually }
says:
  present:
    self: ["В обморок упал{|а}", "Потерял{|а} сознание, ненадолго", "Отключил{ся|ась}, очнул{ся|ась} на полу"]
    other: ["В обморок упал{|а}", "Потерял{|а} сознание, потом очнул{ся|ась}", "Упал{|а} без чувств, ненадолго"]
estimate: true
sources: ["anamnez"]
notes: "Обморок — кратковременная потеря сознания (записи «Анамнеза»: ТЭЛА, расслоение аорты). Признаком угрозы не отмечен, как и `sym.loss_of_consciousness`: сознание вернулось."
review: draft
