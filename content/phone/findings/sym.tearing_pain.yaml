estimate: true
sources: ["anamnez", "388n, п. 11 «д»"]
notes: "Резко начавшаяся сильная боль в груди и (или) спине — самая типичная черта расслоения аорты (cr-946, 1.6; запись «Анамнеза»). Болевой синдром — п. 11 «д»."
