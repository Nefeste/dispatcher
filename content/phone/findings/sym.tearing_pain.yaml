# Признак «по телефону» (срез, С5б; решение владельца #38, вариант 3): что о нём скажет звонящий. Доли `tell` — оценка.
tell: { self: always, relative: usually, neighbour: sometimes, bystander: rarely }
says:
  present:
    self: ["Резкая боль в груди, в спину отдаёт — как разрывает", "Как ножом в грудь и в спину, вдруг", "Боль страшная, раздирает грудь, уходит в спину"]
    other: ["Говорит, резко заболело в груди и в спине, как разрывает", "Схватил{ся|ась} за грудь — боль, говорит, раздирает, в спину", "Вдруг страшная боль в груди, отдаёт в спину"]
