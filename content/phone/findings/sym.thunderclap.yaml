# Признак «по телефону» (срез, С5б; решение владельца #38, вариант 3): что о нём скажет звонящий. Доли `tell` — оценка.
tell: { self: always, relative: usually, neighbour: sometimes, bystander: rarely }
says:
  present:
    self: ["Голова вдруг заболела — как ударили, такой боли никогда не было", "Резко заболела голова, как взорвалось", "Голова раскалывается, началось в один миг"]
    other: ["Говорит, голову как ударило, вдруг", "Схватил{ся|ась} за голову — говорит, никогда так не болело", "Голова вдруг заболела, сильнее некуда"]
threat: "388n, п. 11 «д»"
estimate: true
sources: ["anamnez", "388n, п. 11 «д»"]
notes: "Внезапная сильная боль «по типу удара в голову», «худшая головная боль в жизни» — типичное начало САК (cr-523, 1.6; запись «Анамнеза»). Внезапный болевой синдром — п. 11 «д»."
review: draft
