# Вопросы диспетчера (docs/08-game-design.md, §3; группы — там же). Цена — игровые секунды, числа баланса (§9);
# их подбирает «виртуальный диспетчер». Что сказать диспетчеру — памятка mos-103: возраст, адрес, подъезд, этаж, код.
group: who
rank: 1
text: Сколько лет?
# поле карточки вызова
label: Возраст
cost: 10
opens: []
about: age
tell: { self: sure, relative: always, neighbour: sometimes, bystander: never }
answer:
  self: ["{age}", "{age} {years}"]
  other: ["{age}", "{age} {years}"]
years: [год, года, лет]
# не знает точно — на вид
bands:
  - { to: 30, words: { self: ["Молодой"], other: ["Молод{ой|ая}, лет двадцать пять"] } }
  - { to: 45, words: { self: ["Средних лет"], other: ["Лет сорок, наверное"] } }
  - { to: 60, words: { self: ["За пятьдесят"], other: ["Лет пятьдесят с чем-то"] } }
  - { to: 75, words: { self: ["Пожилой"], other: ["Пожил{ой|ая}, лет семьдесят"] } }
  - { to: 200, words: { self: ["Старый"], other: ["Стар{ый|ая} совсем, за восемьдесят"] } }
