# Повод — первые слова звонящего (docs/08-game-design.md, §3: «что случилось, адрес, кто болен» — памятка mos-103).
# Берётся первый по `rank`, чей признак у больного есть и звонящий о нём знает.
rank: 1
# сколько из тех, кто знает этот признак, начнут с него, % (оценка); остальные — со смутного «плохо»
say: 70
when: [sign.gcs_low, sign.postictal]
words:
  self: []
  other: ["{Who} не отвечает, лежит", "{Who} как будто не слышит, глаза открывает и не отвечает"]
