# «Первая неделя», смена 4 (docs/08-game-design.md, §8; срез — docs/specs/2026-11-vertical-slice.md, часть С1).
# Числа — §8 геймдизайна; строка «что нового» — только то, что в игре уже есть (виды бригад и поликлиника — часть С5,
# ночь — С6: тогда и строка поменяется).
week: { n: 4, day: "Среда, ночь", what: "Ночь: звонков меньше, но и бригад — четыре" }
city: city.proto
# неотложная помощь поликлиники — с 08:00 до 20:00 (срез, С5)
clinic: true
start: 3600
length: 7200
season: autumn
flow: 140
# Бригады — бригады станции под своими номерами (у номера всю неделю тот же вид и подстанция, часть С2); ночью выходят
# первая, вторая, третья (реанимационная) и четвёртая.
crews:
  - { id: crew.1, kind: crew.general, base: base.north }
  - { id: crew.2, kind: crew.general, base: base.north }
  - { id: crew.3, kind: crew.resus, base: base.south }
  - { id: crew.4, kind: crew.general, base: base.south }
