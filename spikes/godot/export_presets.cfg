[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="map/*.bin"
exclude_filter="tools/*, out/*, build/*"
export_path="build/dispatcher-godot.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="games.gornitsa.probe.godot"
package/name="Проба Godot"
package/signed=true
screen/immersive_mode=false
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=false
keystore/release="/root/.local/share/godot/keystores/debug.keystore"
keystore/release_user="androiddebugkey"
keystore/release_password="android"

[preset.1]

